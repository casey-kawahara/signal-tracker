name: Practice run

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days to replay"
        default: "30"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay past days and build docs/replay
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/replay.py --fetch --days "${{ inputs.days }}"
      - name: Commit the practice page
        run: |
          git config user.name "signal-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/replay
          git diff --cached --quiet || git commit -m "Practice run $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
