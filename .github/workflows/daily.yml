name: Daily predictions

on:
  schedule:
    # 12:30 UTC on weekdays = 7:30 AM ET in winter, 8:30 AM ET in summer, before the open
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect data, score old calls, lock new ones, rebuild the page
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m tracker daily
      - name: Check no locked prediction was changed
        run: python -m tracker verify
      - name: Commit results
        run: |
          git config user.name "signal-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.db docs/
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push

