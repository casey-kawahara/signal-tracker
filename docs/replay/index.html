<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Signals</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1b1c1e; --muted: #64666c; --faint: #9a9ca2; --line: #e5e3dd;
  --up: #17804f; --up-bg: #e3f3ea; --down: #c23d33; --down-bg: #fbe9e7; --accent: #3654c9; --accent-bg: #e8ecfb;
  --warn: #9a6200; --warn-bg: #fcefd6; --chip: #efeee9; --shadow: 0 1px 2px rgba(20,20,20,.04), 0 2px 8px rgba(20,20,20,.04);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121315; --panel: #1b1d20; --ink: #ebebe8; --muted: #a0a2a8; --faint: #6f7178; --line: #2b2e33;
          --up: #4fc48b; --up-bg: #15291f; --down: #f2766d; --down-bg: #2e1817; --accent: #91a5ff; --accent-bg: #1e2440;
          --warn: #e8ad4a; --warn-bg: #2d2412; --chip: #24272b; --shadow: none; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
a { color: var(--accent); }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.015em; }
h2 { font-size: 17px; margin: 30px 0 10px; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 .sub { font-weight: 400; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 70ch; }
.sub { color: var(--muted); font-size: 13px; }
.up { color: var(--up); } .down { color: var(--down); }
.tile, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
@media (max-width: 960px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-height: 140px; }
.tile .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tile .big { font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 13px; color: var(--muted); }
.tile .row { display: flex; align-items: center; gap: 14px; }
.ring { flex: none; }
.ring text { font-weight: 700; fill: var(--ink); }
.pair { display: flex; gap: 18px; }
.pair div { font-size: 12px; color: var(--muted); }
.pair b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pair .ours b { color: var(--accent); }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 4px 0; background: var(--panel); }
.split span { display: block; }
.split .u { background: var(--up); } .split .d { background: var(--down); }
.splitlabels { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }

/* stock cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { padding: 14px 14px 12px; cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--faint); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tk { font-weight: 750; font-size: 17px; letter-spacing: .01em; }
.name { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-weight: 650; font-size: 13px; }
.pill.up { background: var(--up-bg); } .pill.down { background: var(--down-bg); }
.pxrow { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
.pxrow .px { font-weight: 650; font-size: 15px; }
.pxrow .chg { font-size: 12px; }
.spark { display: block; width: 100%; height: 44px; }
.meter { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--down-bg), var(--chip) 50%, var(--up-bg)); }
.meter .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--faint); }
.meter .dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--panel); }
.meterlabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 2px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.hot { background: var(--accent-bg); color: var(--accent); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { color: var(--up); } .badge.bad { color: var(--down); }
.why { font-size: 13.5px; margin: 0; color: var(--ink); }
.conf { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* deeper tiles */
.deeper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 960px) { .deeper { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .deeper { grid-template-columns: 1fr; } }
.dtile { cursor: pointer; text-align: left; font: inherit; color: inherit; min-height: 150px; }
.dtile:hover { border-color: var(--faint); }
.dtile .open { color: var(--accent); font-size: 13px; margin-top: auto; }
.strip { display: flex; gap: 3px; flex-wrap: wrap; }
.strip span { width: 12px; height: 12px; border-radius: 3px; }
.strip .r { background: var(--up); } .strip .w { background: var(--down); opacity: .85; }
.hbar { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.hbar .track { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; border-radius: 5px; }
.hbar b { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }

/* dialog */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--panel); color: var(--ink); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,10,12,.45); }
.dlg-hd { position: sticky; top: 0; background: var(--panel); padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; z-index: 1; }
.dlg-hd h3 { margin: 0; font-size: 18px; }
.dlg-body { padding: 16px 18px 20px; }
.x { border: 0; background: var(--chip); color: var(--ink); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; flex: none; }
.dlg-body h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 18px 0 8px; font-weight: 600; }
.dlg-body h4:first-child { margin-top: 0; }
.reasons { margin: 0; padding: 0; list-style: none; }
.reasons li { padding: 4px 0 4px 22px; position: relative; }
.reasons li::before { position: absolute; left: 0; top: 4px; font-size: 13px; }
.reasons li.pos::before { content: "▲"; color: var(--up); } .reasons li.neg::before { content: "▼"; color: var(--down); } .reasons li.dot::before { content: "●"; color: var(--accent); font-size: 10px; top: 7px; }
.facts { width: 100%; border-collapse: collapse; }
.facts td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.facts tr:last-child td { border-bottom: 0; }
.facts td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 10px; }
.facts .hint { display: block; color: var(--faint); font-size: 12px; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mini .k { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mini .k .l { color: var(--muted); font-size: 12px; } .mini .k .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; } .mini .k .c { font-size: 12px; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
table.data tr:last-child td { border-bottom: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
svg text { fill: var(--faint); font-size: 11px; }
.chartwrap { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 2; }
.empty { color: var(--muted); padding: 18px; text-align: center; }
.sim { background: var(--warn-bg); color: var(--ink); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; font-size: 14px; }
.sim b { color: var(--warn); }
.note p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.mt { margin-top: 14px; }
.foot { margin-top: 28px; color: var(--faint); font-size: 12px; text-align: center; }
</style>
</head>

<main>
  <div id="simbanner"></div>

    <div><h1>Stock Signals</h1><p class="lede" id="lede"></p></div>

  <h2>Go deeper <span class="sub">Tap a tile for the full numbers</span></h2>
  <div class="deeper" id="deeper"></div>

  <div class="foot" id="foot"></div>
</main>

  <div class="dlg-hd"><div><h3 id="dlgTitle"></h3><div class="sub" id="dlgSub"></div></div><button class="x" aria-label="Close" onclick="dlg.close()">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

  if (sg.trends_z != null) add("Google searches", "Compared with recent weeks", sg.trends_z > 2 ? "Spiking" : sg.trends_z > 0.75 ? "Rising" : sg.trends_z < -0.75 ? "Falling" : "Normal");
  if (sg.mentions != null) add("Reddit mentions, past day", "Across stock-picking subreddits", Math.round(sg.mentions) + (sg.mention_jump > 1.8 ? ' <span class="up">rising</span>' : ""));
  if (sg.short_ratio != null) add("Short selling", "Share of trades betting it will fall", pct(sg.short_ratio));
  add("Plans to sell new shares", "SEC filings in the past 30 days", sg.dilution_30d ? '<span class="down">Yes</span>' : "None found");
  add("Insiders buying", "Company leaders, past 30 days", sg.insider_net_30d > 0 ? '<span class="up">Yes</span>' : "No");
  if (sg.reverse_split_60d) add("Reverse split", "In the past 60 days", '<span class="down">Yes</span>');
  return `<table class="facts">${rows.join("")}</table>`;
}
function stockDetail(p) {
  const t = p.ticker, other = D.today.find(x => x.ticker === t && x.horizon !== hz);
  const rec = (D.live[hz] && D.live[hz].per_ticker || {})[t];
  const past = D.recent.filter(r => r.ticker === t && r.horizon === hz).slice(0, 20).reverse();
  const reasons = (p.reasons || []).map(r => `<li class="${r.weight > 0 ? "pos" : "neg"}">${esc(PLAIN[r.rule] || r.why)}</li>`).join("");
  const closes = (p.spark || []).map((c, i, a) => ({ i, date: "", close: c }));
  return `<div class="mini">
      <div class="k"><div class="l">The call (${H[hz].tab.toLowerCase()})</div><div class="v ${p.direction}">${p.direction === "up" ? "▲ Up" : "▼ Down"}</div><div class="c">${pct(p.prob_up)} chance of closing higher</div></div>
      <div class="k"><div class="l">Confidence</div><div class="v">${confWord(p.confidence)}</div><div class="c">how strongly the signals agree</div></div>
      ${other ? `<div class="k"><div class="l">${H[other.horizon].tab}</div><div class="v ${other.direction}">${other.direction === "up" ? "▲ Up" : "▼ Down"}</div><div class="c">${confWord(other.confidence).toLowerCase()} confidence</div></div>` : ""}
    </div>
    ${p.spark && p.spark.length > 1 ? `<h4>Price, last ${p.spark.length} trading days</h4>${spark(p.spark, p.direction === "up" ? "var(--up)" : "var(--down)").replace('class="spark"', 'class="spark" style="height:90px"').replace(/<circle[^>]*><\/svg>/, "</svg>")}` : ""}
    ${p.picked_why ? `<h4>Why it's on today's list</h4><ul class="reasons">${p.picked_why.map(w => `<li class="dot">${esc(w)}</li>`).join("")}</ul>
      <p class="sub" style="margin:4px 0 0">${p.picked_rank ? `Ranked #${p.picked_rank} for unusual attention. ` : ""}Getting attention doesn't mean the stock will go up; the call is separate.</p>` : ""}
    <h4>Everything that went into the call</h4>
    ${reasons ? `<ul class="reasons">${reasons}</ul>` : `<p style="margin:0">${NONE}</p>`}
    <h4>What we looked at</h4>${facts(p.signals)}
    <h4>Past ${H[hz].tab.toLowerCase()} calls for ${esc(t)}</h4>
    ${past.length ? `<div class="strip">${past.map(r => `<span class="${r.correct ? "r" : "w"}" title="${esc(shortDate(r.as_of))}: called ${r.direction}, moved ${spct(r.actual_return)}"></span>`).join("")}</div>
      <p class="sub" style="margin:6px 0 0">${rec ? `Right ${rec.right} of ${rec.n} times. ` : ""}Green = right, red = wrong, oldest first.</p>` : '<p class="sub" style="margin:0">None checked yet.</p>'}`;
}
let visible = [];
function cards() {
  const el = document.getElementById("cards");
  document.getElementById("callsTitle").textContent = D.simulation ? "Latest picks in this practice run" : "Today's picks";
  visible = D.today.filter(p => p.horizon === hz).sort((a, b) => (a.direction === "up" ? 0 : 1) - (b.direction === "up" ? 0 : 1) || b.confidence - a.confidence || a.ticker.localeCompare(b.ticker));
  if (!visible.length) { el.innerHTML = `<div class="tile empty" style="grid-column:1/-1">No calls yet. They appear after the first morning run.</div>`; document.getElementById("callsSub").textContent = ""; return; }
  const scanned = D.scanned && !D.simulation ? `Picked from ${D.scanned.toLocaleString()} small stocks · ` : "";
  document.getElementById("callsSub").textContent = `${scanned}Will each close higher or lower ${H[hz].by}? Based on prices through ${shortDate(D.latest_as_of)}. Tap a card for details.`;
  el.innerHTML = visible.map(card).join("");
  el.querySelectorAll(".card").forEach(b => b.onclick = () => {
    const p = visible[+b.dataset.i], d = p.picked_detail || {};
    openDlg(`${p.ticker}${d.name ? " · " + d.name : ""}`, `$${(+p.base_close).toFixed(2)} at the close of ${esc(shortDate(p.as_of))}`, stockDetail(p));
  });
}

/* ---------- deeper tiles + their detail views ---------- */
function mk(label, value, cmp, c = "") { return `<div class="k"><div class="l">${label}</div><div class="v ${c}">${value}</div><div class="c">${cmp}</div></div>`; }
function scoreDetail() {
  const s = D.live[hz] || { n: 0 };
  if (!s.n) return `<div class="empty">Nothing checked yet. ${D.chain.pending} calls are waiting for their result.</div>`;
  const best = Math.max(s.always_up, s.always_down ?? 0);
  return `<div class="mini">
    ${mk("Right", pct(s.hit_rate, 1), `${s.n} calls · last 20 days ${pct(s.hit_rate_recent, 1)}`)}
    ${mk("Vs. guessing one way", spct(s.hit_rate - best), `always "up" ${pct(s.always_up, 1)} · always "down" ${pct(s.always_down, 1)}`, cls(s.hit_rate - best))}
    ${mk("Vs. following the market", spct(s.follow_market == null ? null : s.hit_rate - s.follow_market), `guess each stock moves like the S&amp;P 500 just did: ${pct(s.follow_market, 1)}`, cls(s.follow_market == null ? null : s.hit_rate - s.follow_market))}
    ${mk("Size of moves", pct(s.avg_move_right, 1), `average move when right · ${pct(s.avg_move_wrong, 1)} when wrong`)}
  </div>
  <h4>Share of calls right so far, over time</h4>
  ${lineChart(s.series, [{ key: "always_up", label: 'Always guessing "up"', color: "var(--faint)", dash: 1, w: 1.5 }, { key: "model", label: "Our calls", color: "var(--accent)", w: 2.5 }], { height: 200, base: 0.5, fmt: v => pct(v) })}
  ${s.confidence.length ? `<h4>Does higher confidence mean more often right?</h4>${s.confidence.map(c => hbar(c.bucket, c.hit_rate, `${c.n} calls`)).join("")}` : ""}`;
}
function hbar(label, v, title, color = "var(--accent)") {
  return `<div class="hbar" title="${esc(title)}"><span>${esc(label)}</span><div class="track"><div class="fill" style="width:${(v * 100).toFixed(1)}%;background:${color}"></div></div><b>${pct(v)}</b></div>`;
}
function vsDetail() {
  const p = D.portfolio;
  if (!p || !p.days) return `<div class="empty">Starts once calls are checked.</div>`;
  const pc = v => spct(v / p.start_value - 1);
  return `<p class="sub" style="margin-top:0">Pretend you start with $1,000 and each morning split it equally across that day's "Likely up" picks, sell at the next close, and move everything into the next day's picks. Days with no "up" picks sit in cash. The S&amp;P 500 line holds an index fund (SPY) over the same days. Trading costs and taxes are ignored, and they would eat into a strategy that trades every day.</p>
    <div class="mini">
      ${mk('Buying the "Likely up" picks', money(p.up), `${pc(p.up)} since ${esc(shortDate(p.start_date))}`, cls(p.up - p.start_value))}
      ${mk("S&amp;P 500", money(p.market), `${pc(p.market)} over the same ${p.days} trading days`, cls(p.market - p.start_value))}
      ${mk("Following every call", money(p.both), 'also betting against the "down" picks (short selling, riskier)', cls(p.both - p.start_value))}
      ${mk("Days ahead of the index", `${p.beat_days} of ${p.days}`, "days the picks beat the S&amp;P 500")}
    </div>
    <h4>Growth of $1,000</h4>
    ${lineChart([{ date: p.start_date, up: p.start_value, both: p.start_value, market: p.start_value }, ...p.series],
      [{ key: "market", label: "S&P 500", color: "var(--faint)", dash: 1, w: 1.5 }, { key: "both", label: "Every call (incl. betting against)", color: "var(--warn)", w: 1.8 }, { key: "up", label: '"Likely up" picks', color: "var(--accent)", w: 2.5 }],
      { height: 220, base: p.start_value, fmt: money })}
    <h4>Day by day</h4><div class="tablewrap"><table class="data"><tr><th>Day</th><th>"Up" picks</th><th>Picks</th><th>S&amp;P 500</th><th>Picks value</th><th>S&amp;P value</th></tr>
      ${p.series.slice().reverse().map(r => `<tr><td>${esc(shortDate(r.date))}</td><td>${r.ups} of ${r.picks}</td><td class="${cls(r.r_up)}">${r.ups ? spct(r.r_up, 2) : '<span class="sub">cash</span>'}</td><td class="${cls(r.r_mkt)}">${spct(r.r_mkt, 2)}</td><td>${money(r.up)}</td><td>${money(r.market)}</td></tr>`).join("")}</table></div>`;
}
function pumpsDetail() {
  if (!D.pumps.length) return `<div class="empty">A hype warning means a stock jumped on a spike in online buzz or trading, with no company news or filing to explain it. None so far.</div>`;
  return `<p class="sub" style="margin-top:0">A hype warning means a stock jumped on a spike in online buzz or trading, with no company news or filing to explain it.</p>
    <div class="tablewrap"><table class="data"><tr><th>Date</th><th>Stock</th><th>Jump that week</th><th>The week after</th></tr>
    ${D.pumps.map(p => `<tr><td>${esc(shortDate(p.as_of))}</td><td><b>${esc(p.ticker)}</b></td><td class="${cls(p.signals.ret_5d)}">${spct(p.signals.ret_5d)}</td><td class="${cls(p.actual_return)}">${p.actual_return == null ? '<span class="sub">waiting</span>' : spct(p.actual_return)}</td></tr>`).join("")}</table></div>`;
}
function recentDetail() {
  const rows = D.recent.filter(r => r.horizon === hz);
  if (!rows.length) return `<div class="empty">Nothing checked yet.</div>`;
  return `<div class="tablewrap"><table class="data"><tr><th>Called on</th><th>Stock</th><th>Call</th><th>Confidence</th><th>What happened</th><th></th></tr>
  ${rows.map(r => `<tr><td>${esc(shortDate(r.as_of))}</td><td><b>${esc(r.ticker)}</b></td><td class="${r.direction}">${r.direction === "up" ? "▲ up" : "▼ down"}</td><td>${confWord(r.confidence)}</td><td class="${cls(r.actual_return)}">${spct(r.actual_return)}</td><td>${r.correct ? '<span class="badge ok">Right</span>' : '<span class="badge bad">Wrong</span>'}</td></tr>`).join("")}</table></div>`;
}
function backtestDetail() {
  const b = D.backtest, s = b && b.horizons[hz];
  if (!s) return `<div class="empty">No test run yet.</div>`;
  const best = Math.max(s.always_up, s.always_down ?? 0);
  return `<p class="sub" style="margin-top:0">What would have happened if these rules had run every day from ${esc(shortDate(b.start))}, ${new Date(b.start).getFullYear()} to ${esc(shortDate(b.end))}, on the stocks picked so far. It only uses prices, trading and SEC filings (there's no free history for Reddit or short selling), and only stocks still trading today, which flatters the results a little.</p>
    <div class="mini">${mk("Right", pct(s.hit_rate, 1), `${s.n.toLocaleString()} practice calls`)}${mk("Guessing one way", pct(best, 1), `always "up" ${pct(s.always_up, 1)} · always "down" ${pct(s.always_down, 1)}`)}${mk("Average gain per call", spct(s.strategy_avg_return, 2), `buying and holding: ${spct(s.buy_hold_avg_return, 2)}`, cls(s.strategy_avg_return))}</div>
    <h4>How often each rule was right when it fired</h4>
    ${s.rules.filter(r => r.fired).sort((a, b) => b.hit_rate - a.hit_rate).map(r => hbar(r.rule.replace(/_/g, " "), r.hit_rate, `${r.why} · fired ${r.fired} times · leans ${r.says}`, r.hit_rate >= 0.5 ? "var(--accent)" : "var(--faint)")).join("")}
    <p class="sub">Rules that never fired here: ${s.rules.filter(r => !r.fired).map(r => r.rule.replace(/_/g, " ")).join(", ") || "none"}.</p>`;
}
function howDetail() {
  const names = { yahoo_screener: "Stock scan", reddit_mentions: "Reddit mentions", reddit_tone: "Reddit tone", prices: "Prices", sec: "SEC filings", finra_short_volume: "Short selling", short_interest: "Short interest", google_trends: "Google searches" };
  const list = (D.sources || []).filter(s => names[s.step]);
  return `<div class="note">
    <p><b>How stocks are picked.</b> Every weekday before the market opens, the tracker scans US stocks worth $20 million to $2 billion that trade at least 300,000 shares a day, skipping blank-check shells (SPACs). It ranks them by unusual attention: trading volume compared with normal, the jump in Reddit mentions, and the size of yesterday's price move. The top picks are locked in before any call is made, so every pick counts toward the score.</p>
    <p><b>How calls are made.</b> For each pick it gathers prices and trading activity, SEC filings (plans to sell new shares, insiders buying), Reddit chatter, Google searches and short selling. A short list of simple rules turns that into a call. Confidence shows how strongly the rules agree; "low" is common and honest.</p>
    <p><b>Kept honest.</b> Calls can never be changed after they're made. Each is locked with a timestamp, chained to the one before it, and saved publicly on GitHub every day.</p>
    <p>This is an experiment, not investment advice. Small stocks are risky and a few weeks of results can be luck.</p></div>
    ${list.length ? `<h4>Data sources on the last run</h4><div class="badges">${list.map(s => `<span class="badge ${s.status === "ok" ? "ok" : s.status === "partial" ? "warn" : s.status === "skipped" ? "" : "bad"}" title="${esc(s.detail)}">${names[s.step]} ${s.status === "ok" ? "✓" : s.status === "partial" ? "partly working" : s.status === "skipped" ? "not set up" : "not working"}</span>`).join("")}</div>` : ""}
    ${D.runs.length ? `<h4>Recent run log</h4><div class="tablewrap"><table class="data"><tr><th>Time (UTC)</th><th>Step</th><th>Status</th><th>Detail</th></tr>${D.runs.map(r => `<tr><td>${esc(r.started_at)}</td><td>${esc(r.step)}</td><td>${esc(r.status)}</td><td class="sub">${esc(r.detail)}</td></tr>`).join("")}</table></div>` : ""}`;
}
function deeper() {
  const s = D.live[hz] || { n: 0 }, p = D.portfolio, b = D.backtest, bs = b && b.horizons[hz];
  const recent = D.recent.filter(r => r.horizon === hz).slice(0, 40).reverse();
  const done = D.pumps.filter(x => x.actual_return != null), fell = done.filter(x => x.actual_return < 0).length;
  const okSources = (D.sources || []).filter(x => x.status === "ok").length, allSources = (D.sources || []).filter(x => !["scan", "pick", "resolve", "predict", "prices_shortlist", "demo", "replay"].includes(x.step)).length;
  const tiles = [
    { id: "score", title: "Track record", fn: scoreDetail, body: s.n ? `<div class="big">${pct(s.hit_rate)}</div><div class="note">right, vs ${pct(Math.max(s.always_up, s.always_down ?? 0))} for simple guessing</div>${lineChart(s.series, [{ key: "model", label: "Our calls", color: "var(--accent)" }], { height: 40, axis: false, base: 0.5, fmt: v => pct(v) })}` : `<div class="note">Results show up once the first calls are checked.</div>` },
    { id: "vs", title: "Vs. the S&P 500", fn: vsDetail, body: p && p.days ? `<div class="pair"><div class="ours">Our picks<b>${money(p.up)}</b></div><div>S&amp;P 500<b>${money(p.market)}</b></div><div>Every call<b style="color:var(--warn)">${money(p.both)}</b></div></div><div class="note">from $1,000 on ${esc(shortDate(p.start_date))}</div>` : `<div class="note">What $1,000 following the picks would be worth vs the index.</div>` },
    { id: "calls", title: "Every past call", fn: recentDetail, body: recent.length ? `<div class="strip">${recent.map(r => `<span class="${r.correct ? "r" : "w"}" title="${esc(r.ticker)} ${esc(shortDate(r.as_of))}"></span>`).join("")}</div><div class="note">Last ${recent.length} ${H[hz].tab.toLowerCase()} calls: green right, red wrong</div>` : `<div class="note">Each call, what happened, and whether it was right.</div>` },
    { id: "hype", title: "Hype warnings", fn: pumpsDetail, body: `<div class="big">${D.pumps.length}</div><div class="note">${done.length ? `${fell} of ${done.length} fell the week after` : "flagged so far"}</div>` },
    { id: "bt", title: "Testing on past data", fn: backtestDetail, body: bs ? `${hbar("Our rules", bs.hit_rate, "")}${hbar("Guessing", Math.max(bs.always_up, bs.always_down ?? 0), "", "var(--faint)")}<div class="note">${bs.n.toLocaleString()} practice calls, ${new Date(b.start).getFullYear()}–${new Date(b.end).getFullYear()}</div>` : `<div class="note">Not run yet.</div>` },
    { id: "how", title: "How this works", fn: howDetail, body: `<div class="note">How stocks are picked, how calls are made, and how they're kept honest.</div>${allSources ? `<div class="note"><b style="color:var(--ink)">${okSources} of ${allSources}</b> data sources working</div>` : ""}` },
  ];
  const el = document.getElementById("deeper");
  el.innerHTML = tiles.map((t, i) => `<button class="tile dtile" data-i="${i}"><div class="label">${t.title}</div>${t.body}<span class="open">Open ›</span></button>`).join("");
  el.querySelectorAll(".dtile").forEach(btn => btn.onclick = () => { const t = tiles[+btn.dataset.i]; openDlg(t.title.replace("&amp;", "&"), D.simulation ? "Practice run" : H[hz].tab + " calls", t.fn()); });
}

function render() { tabs(); header(); kpis(); cards(); deeper(); wireCharts(document); }
render();
</script>
